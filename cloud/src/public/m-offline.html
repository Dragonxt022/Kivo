<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8000">
  <title>Sem conexão — Kivo</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9; color: #1b1b21; text-align: center;
    }
    .box { max-width: 22rem; }
    .icon {
      width: 4.5rem; height: 4.5rem; margin: 0 auto 1.25rem; border-radius: 50%;
      display: grid; place-items: center; background: #fff3e6; color: #ff8000;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { margin: 0 0 1.5rem; color: #5c5c6b; line-height: 1.5; }
    button {
      font: inherit; font-weight: 600; color: #fff; background: #ff8000; border: 0;
      border-radius: .65rem; padding: .75rem 1.5rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1>Sem conexão</h1>
    <p>O painel precisa de internet para mostrar os dados da loja. Verifique sua conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
