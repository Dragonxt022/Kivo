services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kuruk
      MYSQL_DATABASE: kuruk_cloud
    ports:
      - '3307:3306'
    volumes:
      - kuruk_cloud_mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  kuruk_cloud_mysql:
