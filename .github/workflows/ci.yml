name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por branch: um push novo cancela a análise do anterior, que já não
# interessa a ninguém.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Tipos e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript (sem emitir)
        run: npx tsc -p tsconfig.json --noEmit
      - name: ESLint
        run: npx eslint src

  testes:
    name: Suíte de integração
    runs-on: ubuntu-latest
    services:
      # Os testes de sync/licença/backup sobem o cloud/ e falam com este MySQL.
      # A porta 3307 é a mesma do cloud/docker-compose.yml — os testes leem CLOUD_DB_PORT,
      # mas o padrão embutido neles é 3307, então mantemos o mapeamento igual ao local.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kuruk
          MYSQL_DATABASE: kuruk_cloud
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pkuruk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CLOUD_DB_HOST: 127.0.0.1
      CLOUD_DB_PORT: '3307'
      CLOUD_DB_USER: root
      CLOUD_DB_PASSWORD: kuruk
      CLOUD_DB_NAME: kuruk_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar o cloud/
        run: npm --prefix cloud ci
      - name: Migrations do cloud/
        run: npm --prefix cloud run migrate
      - name: Testes
        # O runner sonda o MySQL antes de começar: se o serviço não subir, os testes de
        # nuvem entram como SKIP em vez de derrubar a execução com ECONNREFUSED.
        run: node scripts/test-runner.js --plain

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E — cadastro de produtos
        run: node scripts/kuruk test:e2e
      - name: E2E — comandas e mesas
        run: node scripts/kuruk test:e2e:comandas
      - name: QA — login e primeiro acesso
        run: node scripts/kuruk test:e2e:login
      - name: QA — PDV e vendas
        run: node scripts/kuruk test:e2e:pdv
      - name: QA — caixa
        run: node scripts/kuruk test:e2e:caixa
      - name: QA — compras e estoque
        run: node scripts/kuruk test:e2e:compras
      - name: QA — layout mobile
        run: node scripts/kuruk test:e2e:mobile
      - name: QA — responsivo de vendas e caixa
        run: node scripts/kuruk test:e2e:responsivo-vendas
      - name: QA — abertura personalizada por usuário
        run: node scripts/kuruk test:e2e:user-startup
      - name: Screenshots da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: .qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7

  e2e-mobile:
    name: E2E Kuruk Web (mobile)
    runs-on: ubuntu-latest
    services:
      # O Kuruk Web é testado ponta a ponta (desktop → nuvem → celular), então precisa do
      # MySQL do cloud/ — mesma porta do docker-compose local.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kuruk
          MYSQL_DATABASE: kuruk_cloud
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pkuruk"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      CLOUD_DB_HOST: 127.0.0.1
      CLOUD_DB_PORT: '3307'
      CLOUD_DB_USER: root
      CLOUD_DB_PASSWORD: kuruk
      CLOUD_DB_NAME: kuruk_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Instalar o cloud/
        run: npm --prefix cloud ci
      - name: Migrations do cloud/
        run: npm --prefix cloud run migrate
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: QA — Kuruk Web no celular
        run: node scripts/kuruk test:e2e:kuruk-web-mobile
      - name: Screenshots da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-screenshots
          path: .qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
